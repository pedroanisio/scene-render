name: Validate and package Linux release
description: Run release smoke tests and package the exact compiled commit
runs:
  using: composite
  steps:
    - name: Check release version
      id: version
      shell: bash
      run: |
        python3 - <<'PY'
        import os, tomllib
        with open('Cargo.toml', 'rb') as f:
            version = tomllib.load(f)['workspace']['package']['version']
        tag = f'v{version}'
        if os.environ.get('GITHUB_REF_TYPE') == 'tag':
            assert os.environ['GITHUB_REF_NAME'] == tag, 'tag must match Cargo.toml'
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            print(f'tag={tag}', file=f)
        PY
        python3 tools/check_release_hygiene.py --all
    - name: Verify validated binary
      env:
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      shell: bash
      run: |
        test "$(cat target/release/COMMIT)" = "$GITHUB_SHA"
        (cd target/release && sha256sum -c SHA256SUMS)
        chmod +x target/release/scene-render
        test "$(target/release/scene-render --version)" = "scene-render ${RELEASE_TAG#v}"
    - name: Smoke test the release binary
      shell: bash
      run: |
        export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
        mkdir -m 700 -p "$XDG_RUNTIME_DIR"
        target/release/scene-render --version
        cat > "$RUNNER_TEMP/smoke.xml" <<'XML'
        <scene version="1.2"><project width="64" height="36" fps="10" duration="0.2" background="#000000"/><composition><shape id="box" shape="rect" width="16" height="16" fill="#FFFFFF"/></composition></scene>
        XML
        target/release/scene-render validate "$RUNNER_TEMP/smoke.xml"
        target/release/scene-render render "$RUNNER_TEMP/smoke.xml" -o "$RUNNER_TEMP/smoke.png" --strict
        target/release/scene-render encode "$RUNNER_TEMP/smoke.xml" -o "$RUNNER_TEMP/smoke.mkv" --codec ffv1 --hw software --parallel 1 --strict --no-upload
        test "$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/smoke.mkv")" = 2
    - name: Package
      env:
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      shell: bash
      run: |
        package="scene-render-${RELEASE_TAG}-linux-x86_64"
        mkdir -p "dist/$package"
        cp target/release/scene-render README.md CHANGELOG.md DISCLAIMER.md LICENSE NOTICE COMMERCIAL.md THIRD-PARTY-NOTICES.md capabilities.json "dist/$package/"
        printf '%s\n' "$GITHUB_SHA" > "dist/$package/COMMIT"
        tar -C dist -czf "dist/$package.tar.gz" "$package"
        cd dist
        sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
