name: Renderer runtime environment
description: Install and record runtime dependencies for renderer checks
inputs:
  cache-key:
    description: Distinguish shader caches for workers in the same matrix job
    default: ''
  evidence:
    description: Install the Python evidence tools
    default: 'false'
  heic:
    description: Require and verify HEIC decoding
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      id: runtime
      run: |
        runtime_packages=(mesa-vulkan-drivers libvulkan1 vulkan-tools libegl1 libgl1-mesa-dri ffmpeg curl fonts-dejavu-core fonts-dejavu-extra fonts-noto-color-emoji fonts-wqy-zenhei)
        if [ "${{ inputs.evidence }}" = true ]; then
          runtime_packages+=(python3-venv python3-lxml)
        fi
        if [ "${{ inputs.heic }}" = true ]; then
          runtime_packages+=(libheif-examples libheif-plugin-libde265)
        fi
        sudo apt-get update
        sudo apt-get install -y "${runtime_packages[@]}"
        if [ "${{ inputs.heic }}" = true ]; then
          heif-convert crates/sr-media/tests/fixtures/still/p3-nclx.heic "$RUNNER_TEMP/hevc-check.png"
          test -s "$RUNNER_TEMP/hevc-check.png"
          echo "SR_REQUIRE_HEIC=1" >> "$GITHUB_ENV"
        fi
        echo "SR_REQUIRE_GPU=1" >> "$GITHUB_ENV"
        echo "SR_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"
        echo "SR_REQUIRE_VULKAN=1" >> "$GITHUB_ENV"
        echo "SR_REQUIRE_GL=1" >> "$GITHUB_ENV"
        # the corpus goldens compare only on an adapter provenance.json lists: a Mesa update the set has not been
        # verified on fails them, naming the adapter, instead of skipping every comparison
        echo "SR_REQUIRE_GOLDEN_ADAPTER=1" >> "$GITHUB_ENV"
        echo "SR_GPU_BACKEND=vulkan" >> "$GITHUB_ENV"
        icd=$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)
        test -n "$icd"
        echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
        echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/runtime" >> "$GITHUB_ENV"
        mkdir -m 700 -p "$RUNNER_TEMP/runtime"
        echo "MESA_SHADER_CACHE_DIR=$RUNNER_TEMP/mesa-cache" >> "$GITHUB_ENV"
        mesa_version=$(dpkg-query -W mesa-vulkan-drivers libgl1-mesa-dri | sha256sum | cut -c1-16)
        echo "mesa-version=$mesa_version" >> "$GITHUB_OUTPUT"
        # llvmpipe caches shaders as machine code for this CPU, and its cache key names only the vector width:
        # a cache written on a runner with AVX-512 kills the renderer with SIGILL on one without, so the key
        # names the CPU model and its instruction-set flags
        cpu=$(grep -m2 -E '^(model name|flags)' /proc/cpuinfo | sha256sum | cut -c1-16)
        echo "cpu=$cpu" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/mesa-cache
        key: mesa-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.mesa-version }}-${{ steps.runtime.outputs.cpu }}-${{ github.job }}-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: |
          mesa-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.mesa-version }}-${{ steps.runtime.outputs.cpu }}-${{ github.job }}-${{ inputs.cache-key }}-
    - shell: bash
      if: inputs.evidence == 'true'
      run: |
        python3 -m venv --system-site-packages "$RUNNER_TEMP/evidence-python"
        "$RUNNER_TEMP/evidence-python/bin/pip" install -r tools/evidence/requirements.txt
        echo "$RUNNER_TEMP/evidence-python/bin" >> "$GITHUB_PATH"
    - shell: bash
      run: |
        mkdir -p target/environment
        {
          git rev-parse HEAD
          if command -v rustc >/dev/null; then rustc -Vv; fi
          uname -a
          dpkg-query -W mesa-vulkan-drivers libvulkan1 ffmpeg
          if [ "${{ inputs.heic }}" = true ]; then dpkg-query -W libheif-examples libheif-plugin-libde265; fi
          if [ "${{ inputs.evidence }}" = true ]; then python3 -m pip freeze; fi
          vulkaninfo --summary
        } > target/environment/versions.txt 2>&1
